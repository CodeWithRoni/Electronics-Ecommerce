name: Build Electronics E-commerce on main
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-main
  cancel-in-progress: true
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build independent storefront
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://electronics-ecommerce-api.ahroni-usa.workers.dev' }}
        run: |
          npm ci
          npm run build
          touch dist/.nojekyll
      - name: Publish build into main/docs
        run: |
          rm -rf docs
          mkdir docs
          cp -a dist/. docs/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if ! git diff --cached --quiet; then
            git commit -m "Build website in main/docs for ${GITHUB_SHA::7}"
            git push origin HEAD:main
          fi
